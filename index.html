  .wrap { max-width:1100px; margin:0 auto; padding:0 24px; }

  /* Brushed-steel banner */
  .steel { position:relative; height:300px; overflow:hidden; background:transparent; }
  .steel .wrap { z-index:1; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; }
  .mark { height:150px; width:auto; filter:drop-shadow(0 2px 6px rgba(0,0,0,.25)); }
  .bar { font-size:15px; font-weight:800; text-align:center; line-height:1.4; border-top:3px solid var(--red); padding-top:10px; }

  main .wrap { display:grid; grid-template-columns:1fr 1fr; gap:48px; padding-top:72px; padding-bottom:72px; }
  .wordmark { height:64px; width:auto; display:block; margin-bottom:36px; text-transform:none; }
  .wordmark-fallback { font-size:44px; text-transform:none; font-stretch:100%; margin-bottom:36px; }
  h1 { font-size:clamp(56px,9vw,120px); letter-spacing:-0.03em; line-height:1; font-weight:800; }
  .meta { display:grid; grid-template-columns:auto 1fr; gap:14px 24px; font-size:16px; align-content:start; }
  .meta dd { text-align:right; }
  .meta a { color:inherit; text-decoration:none; }

  form { grid-column:1 / -1; margin-top:24px; }
  .head, .row { display:grid; grid-template-columns:1fr 1fr; gap:24px; }
  .head { font-size:16px; padding-bottom:12px; border-bottom:2px solid var(--ink); }
  .head span:last-child { text-align:right; }
  .field { padding:20px 0; border-bottom:1px solid var(--ink); }
  label { display:block; font-size:12px; font-weight:800; color:var(--muted); margin-bottom:6px; }
  input, textarea { width:100%; border:0; background:transparent; outline:none; font:inherit; font-size:18px;
         color:var(--ink); text-transform:none; font-weight:600; border-radius:0; }
  textarea { resize:vertical; min-height:80px; }
  .full { grid-column:1 / -1; }
  .foot { display:flex; justify-content:space-between; align-items:flex-end; gap:24px; padding-top:28px; }
  .note { color:#a8101a; font-weight:800; font-size:14px; line-height:1.3; }
  button { background:var(--red); color:#fff; border:0; font:inherit; font-size:18px; font-weight:800;
           padding:14px 36px; cursor:pointer; text-transform:uppercase; }
  button:disabled { opacity:.5; cursor:wait; }
  #status { font-size:14px; min-height:1.2em; margin-top:12px; text-align:right; }
  .hp { display:none; }
  .dot { display:inline-block; width:.22em; height:.22em; background:var(--yellow); border:1px solid var(--ink); border-radius:50%; vertical-align:0; margin-left:.08em; }

  footer { border-top:2px solid var(--ink); }
  footer .wrap { display:flex; justify-content:space-between; padding-top:20px; padding-bottom:28px; font-size:13px; }

  @media (max-width:760px) {
    .steel { height:auto; overflow:visible; }
    .steel .wrap { padding-top:32px; gap:16px; }
    .mark { height:96px; }
    .bar { font-size:13px; }
    main .wrap { grid-template-columns:1fr; gap:36px; padding-top:36px; padding-bottom:48px; }
    .wordmark { height:52px; margin-bottom:24px; }
    h1 { font-size:64px; }
    .meta { font-size:14px; gap:10px 16px; }
    form { margin-top:8px; }
    .row { grid-template-columns:1fr; gap:0; }
    .foot { flex-direction:column; align-items:stretch; }
    button { width:100%; padding:16px; }
    #status { text-align:left; }
  }
</style>
</head>

<script>
  const form = document.getElementById('contact');
  const status = document.getElementById('status');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = form.querySelector('button');
    btn.disabled = true; status.textContent = 'Sending…';
    try {
      const res = await fetch(form.action, { method:'POST', headers:{Accept:'application/json'}, body:new FormData(form) });
      const data = await res.json();
      if (data.success) { form.reset(); status.textContent = 'Received. Talk soon.'; }
      else { status.textContent = 'Error — email hello@espaciovm.com'; }
    } catch { status.textContent = 'Error — email hello@espaciovm.com'; }
    btn.disabled = false;
  });
</script>
